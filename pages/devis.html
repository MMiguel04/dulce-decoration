<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../styles/commun.css">
    <link rel="stylesheet" href="../styles/devis.css">

    <!-- Favicon -->
    <link rel="icon" href="../images/favicon/favicon.ico" type="image/x-icon">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            <img src="../images/logoNavBar.png" alt="DD ArtDeco" class="img-fluid" style="max-height: 60px;">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="../index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="a-propos.html">À propos</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link active" href="devis.html">Devis</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENU -->
<section class="section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">

                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">

                        <h1 class="display-5 fw-bold text-center mb-4">Demande de devis</h1>
                        <p class="lead text-center text-muted mb-5">
                            Décrivez votre projet au Mans ou alentours, nous vous envoyons un devis personnalisé sous 24h.
                        </p>

                        <!-- ✅ FORMULAIRE NETLIFY FINAL -->
                        <form
                            name="devis-final"
                            method="POST"
                            data-netlify="true"
                            netlify-honeypot="bot-field"
                            action="/merci.html"
                        >
                            <!-- Champs requis Netlify -->
                            <input type="hidden" name="form-name" value="devis-final">
                            <input type="hidden" name="bot-field">
                            <input type="hidden" name="redirect" value="/merci.html">

                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-medium">Nom complet *</label>
                                    <input type="text" name="nom" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium">Téléphone</label>
                                    <input type="tel" name="telephone" class="form-control">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Email *</label>
                                    <input type="email" name="email" class="form-control" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Type d'événement *</label>
                                    <select name="type-evenement" class="form-select" required>
                                        <option value="" disabled selected>Choisissez...</option>
                                        <option>Mariage</option>
                                        <option>Anniversaire</option>
                                        <option>Baptême</option>
                                        <option>Baby shower / Gender reveal</option>
                                        <option>Événement d'entreprise</option>
                                        <option>Autre</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium">Date approximative</label>
                                    <input type="date" name="date" class="form-control">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Détails du projet</label>
                                    <textarea
                                        name="details"
                                        class="form-control"
                                        rows="6"
                                        placeholder="Lieu, nombre de personnes, thème, couleurs, budget, inspirations..."
                                    ></textarea>
                                </div>
                            </div>

                            <div class="text-center mt-5">
                                <button type="submit" class="btn btn-primary btn-lg px-5">
                                    Envoyer ma demande
                                </button>
                                <p class="mt-3 small text-muted">
                                    Devis gratuit et sans engagement – réponse sous 24h
                                </p>
                            </div>
                        </form>
                        <!-- ✅ FIN FORMULAIRE -->

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer py-4">
    <div class="container text-center">
        <p class="mb-2 small text-muted">© 2026 DD ArtDeco – Le Mans et alentours</p>
    </div>
</footer>

<script src="../js/script.js"></script>

</body>
</html>
